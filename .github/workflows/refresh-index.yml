name: Refresh market index

# Keeps each entry pinned to a real commit (format 1 requires it) without hand editing:
# resolve the pin from each plugin repo's latest Release, then commit index.json when it
# actually changed. Pages redeploys on the commit.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [plugin-released]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: refresh-index
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve latest releases into index.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-index.mjs

      - name: Commit when the index changed
        run: |
          if git diff --quiet -- index.json; then
            echo "index.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "chore: refresh index from latest releases"
          git push
